name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke CLI help/usage
        run: |
          node dist/main.js 2>&1 | head -5 || true
          node dist/main.js url= 2>&1 | head -3 || true
